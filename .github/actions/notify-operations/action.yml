name: Notify Operations
description: Report the selected GitHub failure-email policy or send an explicitly selected webhook.

inputs:
  mode:
    description: Explicit transport policy; github-email delegates failure notifications to GitHub.
    required: false
    default: github-email
  webhook-url:
    description: Webhook URL to post the alert to.
    required: false
  title:
    description: Alert title.
    required: true
  summary:
    description: Alert summary.
    required: true
  level:
    description: Alert level.
    required: false
    default: error

runs:
  using: composite
  steps:
    - name: Apply workflow-failure notification policy
      shell: bash
      env:
        OPERATIONS_ALERT_MODE: ${{ inputs.mode }}
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        ALERT_TITLE: ${{ inputs.title }}
        ALERT_SUMMARY: ${{ inputs.summary }}
        ALERT_LEVEL: ${{ inputs.level }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/notify-operations.cjs"
