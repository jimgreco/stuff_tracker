name: Production Health

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-health.yml
      - .github/scripts/*production-health*
      - .github/scripts/*operations*
      - .github/actions/notify-operations/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/production-health.yml
      - .github/scripts/*production-health*
      - .github/scripts/*operations*
      - .github/actions/notify-operations/**
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: node --test .github/scripts/production-health.test.cjs .github/scripts/operations.test.cjs

  health:
    if: github.repository == 'jimgreco/stuff_tracker' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || secrets.PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Check production health endpoints
        run: node .github/scripts/check-production-health.cjs
      - name: Verify alert coverage is configured
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::error::OPERATIONS_ALERT_WEBHOOK_URL is missing; alert delivery is not configured."
            exit 1
          fi

  notify-failure:
    if: ${{ always() && (needs.health.result == 'failure' || needs.health.result == 'cancelled') }}
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Notify operations
        uses: ./.github/actions/notify-operations
        with:
          webhook-url: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          title: Production health check failed
          summary: health=${{ needs.health.result }}
