name: TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stuff-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      run_build: ${{ steps.changes.outputs.run_build }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan iOS workflow
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git ls-tree -r --name-only HEAD)
          else
            changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(ios/|\.github/workflows/testflight\.yml$)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi

          echo "run_build=false" >> "$GITHUB_OUTPUT"

      - name: No iOS changes
        if: steps.changes.outputs.run_tests != 'true'
        run: echo "No iOS changes detected; required test check satisfied."

      - name: Select Xcode 26
        if: steps.changes.outputs.run_tests == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' /Applications/Xcode*.app
          selected_xcode=$(ruby <<'RUBY'
            candidates = Dir.glob('/Applications/Xcode*.app').select do |path|
              File.basename(path).match?(/\AXcode(?:[_-])?26(?:[._-]\d+)*\.app\z/)
            end
            candidates = Dir.glob('/Applications/Xcode*.app') if candidates.empty?

            def version_key(path)
              File.basename(path).scan(/\d+/).map(&:to_i)
            end

            selected = candidates.max_by { |path| version_key(path) }
            abort('No Xcode installation found') unless selected
            puts selected
          RUBY
          )
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          echo "Selected: $selected_xcode"
          xcodebuild -version

      - name: Prepare iOS simulator
        if: steps.changes.outputs.run_tests == 'true'
        id: simulator
        run: |
          set -euo pipefail

          simulator_sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iPhoneSimulator SDK version: $simulator_sdk_version"
          if ! xcrun simctl list runtimes | grep -q "iOS $simulator_sdk_version"; then
            echo "Matching iOS simulator runtime is missing; downloading iOS platform."
            sudo xcodebuild -downloadPlatform iOS
          fi
          export SIMULATOR_SDK_VERSION="$simulator_sdk_version"

          runtime=$(xcrun simctl list runtimes --json | ruby -rjson -e '
            def version_key(value)
              value.to_s.scan(/\d+/).map(&:to_i)
            end

            runtimes = JSON.parse(STDIN.read).fetch("runtimes").select do |runtime|
              runtime["isAvailable"] && runtime["platform"] == "iOS"
            end
            matching = runtimes.select { |runtime| runtime["version"].to_s == ENV.fetch("SIMULATOR_SDK_VERSION") }
            selected = matching.max_by { |runtime| version_key(runtime["version"]) }
            selected ||= runtimes.max_by { |runtime| version_key(runtime["version"]) }
            abort("No available iOS simulator runtime found") unless selected
            puts selected.fetch("identifier")
          ')

          device_type=$(xcrun simctl list devicetypes --json | ruby -rjson -e '
            data = JSON.parse(STDIN.read)
            types = data.fetch("devicetypes").select { |type| type["name"].to_s.include?("iPhone") }
            preferred = [
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15"
            ]
            selected = preferred.filter_map { |identifier| types.find { |type| type["identifier"] == identifier } }.first
            selected ||= types.reverse.find { |type| type["name"].to_s.include?("Pro") }
            selected ||= types.last
            abort("No iPhone simulator device type found") unless selected
            puts selected.fetch("identifier")
          ')

          udid=$(xcrun simctl create "StuffTracker CI" "$device_type" "$runtime")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        if: steps.changes.outputs.run_tests == 'true'
        working-directory: ios
        run: |
          xcodebuild \
            -project StuffTracker.xcodeproj \
            -scheme StuffTracker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination '${{ steps.simulator.outputs.destination }}' \
            test

  build:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.test.outputs.run_build == 'true'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Select Xcode 26
      run: |
        set -euo pipefail
        printf '%s\n' /Applications/Xcode*.app
        selected_xcode=$(ruby <<'RUBY'
          candidates = Dir.glob('/Applications/Xcode*.app').select do |path|
            File.basename(path).match?(/\AXcode(?:[_-])?26(?:[._-]\d+)*\.app\z/)
          end
          candidates = Dir.glob('/Applications/Xcode*.app') if candidates.empty?

          def version_key(path)
            File.basename(path).scan(/\d+/).map(&:to_i)
          end

          selected = candidates.max_by { |path| version_key(path) }
          abort('No Xcode installation found') unless selected
          puts selected
        RUBY
        )
        sudo xcode-select -s "$selected_xcode/Contents/Developer"
        echo "Selected: $selected_xcode"
        xcodebuild -version
    - name: Test no-mutation release guards
      run: |
        node --test .github/scripts/release-guard-tests.mjs
        PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_release.py
    - name: Bind release to clean source
      run: |
        set -euo pipefail
        BUILD_NUMBER="$(git rev-list --count HEAD)"
        python3 .github/scripts/verify-release.py prepare-source --sha "$GITHUB_SHA" --build "$BUILD_NUMBER"
        echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        echo "CI_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
    - name: Prepare existing app-specific authentication
      run: |
        set -euo pipefail
        for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID API_KEY CERT_P12 CERT_PWD KC_PWD; do
          test -n "${!name}" || { echo "Missing existing app-specific configuration: $name"; exit 1; }
        done
        umask 077
        RELEASE_TEMP="$(mktemp -d "$RUNNER_TEMP/native-release.XXXXXX")"
        echo "RELEASE_TEMP=$RELEASE_TEMP" >> "$GITHUB_ENV"
        KEY_PATH="$RELEASE_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
        export KEY_PATH
        python3 - <<'PY'
        import base64, os
        key = os.environ['API_KEY'].strip().replace('\\n', '\n')
        if 'BEGIN PRIVATE KEY' not in key:
            key = base64.b64decode(key).decode()
        if 'BEGIN PRIVATE KEY' not in key:
            raise SystemExit('Existing API key encoding is unsupported.')
        with open(os.environ['KEY_PATH'], 'x') as file:
            file.write(key.rstrip() + '\n')
        PY
        {
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
        } >> "$GITHUB_ENV"
        # altool searches ./private_keys. The directory belongs to this run only.
        mkdir "$RELEASE_TEMP/private_keys"
        ln -s "$KEY_PATH" "$RELEASE_TEMP/private_keys/$(basename "$KEY_PATH")"
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
    - name: Check current app, Jim-only audience and iOS build number
      run: |
        set -euo pipefail
        node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Import existing signing identity and verify pinned profiles
      run: |
        set -euo pipefail
        umask 077
        KEYCHAIN_PATH="$RELEASE_TEMP/signing.keychain-db"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        security list-keychains -d user > "$RELEASE_TEMP/original-keychains.txt"
        security create-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
        python3 - "$KEYCHAIN_PATH" "$RELEASE_TEMP/original-keychains.txt" <<'PY'
        import shlex, subprocess, sys
        from pathlib import Path
        subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[1], *shlex.split(Path(sys.argv[2]).read_text())], check=True)
        PY
        printf '%s' "$CERT_P12" | base64 -d > "$RELEASE_TEMP/cert.p12"
        security import "$RELEASE_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KEYCHAIN_PATH" >/dev/null
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq '963A7A5107DB8D4C141371C285F71CCAE84A5452'
        security find-certificate -c 'Apple Distribution: James Greco' -p "$KEYCHAIN_PATH" > "$RELEASE_TEMP/certificate.pem"
        openssl x509 -in "$RELEASE_TEMP/certificate.pem" -outform DER -out "$RELEASE_TEMP/certificate.der"
        mkdir "$RELEASE_TEMP/profiles"
        node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/profiles"
        python3 .github/scripts/verify-release.py profiles --directory "$RELEASE_TEMP/profiles" --certificate-der "$RELEASE_TEMP/certificate.der" --destination "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
      env:
        CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
    - name: Archive iOS using only verified existing profiles
      run: |
        set -euo pipefail
        python3 .github/scripts/verify-release.py source --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
        xcodebuild archive \
          -project "ios/StuffTracker.xcodeproj" \
          -scheme "StuffTracker" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RELEASE_TEMP/App.xcarchive" \
          DEVELOPMENT_TEAM=V6JPQCD336 \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=963A7A5107DB8D4C141371C285F71CCAE84A5452 \
          CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
          APP_STORE_PROFILE="ee6f6bdf-ea78-4f46-a746-cdba6fab1bdd"
    - name: Export internal-only IPA without provisioning updates
      run: |
        set -euo pipefail
        python3 .github/scripts/verify-release.py export-options --output "$RELEASE_TEMP/ExportOptions.plist"
        xcodebuild -exportArchive -archivePath "$RELEASE_TEMP/App.xcarchive" -exportOptionsPlist "$RELEASE_TEMP/ExportOptions.plist" -exportPath "$RELEASE_TEMP/export"
        python3 - <<'PY'
        import os
        from pathlib import Path
        files = list((Path(os.environ['RELEASE_TEMP'])/'export').glob('*.ipa'))
        if len(files) != 1:
            raise SystemExit('Expected exactly one exported iOS IPA.')
        with open(os.environ['GITHUB_ENV'], 'a') as file:
            file.write('IPA_PATH=' + str(files[0]) + '\n')
        PY
    - name: Verify signed artifact and recheck current Apple scope
      run: |
        set -euo pipefail
        python3 .github/scripts/verify-release.py artifact --ipa "$IPA_PATH" --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
        # Recheck revocation/profile state immediately before the only Apple write.
        mkdir "$RELEASE_TEMP/final-profiles"
        node .github/scripts/asc-readonly.mjs profiles --certificate-der "$RELEASE_TEMP/certificate.der" --directory "$RELEASE_TEMP/final-profiles"
        for path in "$RELEASE_TEMP/profiles/"*.mobileprovision; do
          cmp "$path" "$RELEASE_TEMP/final-profiles/$(basename "$path")"
        done
        node .github/scripts/asc-readonly.mjs preflight --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Upload one verified iOS build to existing TestFlight app
      run: |
        set -euo pipefail
        cd "$RELEASE_TEMP"
        xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RELEASE_TEMP/upload.log"
        if grep -Eiq 'UPLOAD FAILED|Validation failed|Failed to upload package' "$RELEASE_TEMP/upload.log"; then exit 1; fi
        grep -Eiq 'UPLOAD SUCCEEDED|successfully uploaded' "$RELEASE_TEMP/upload.log"
    - name: Verify processing and approved internal group availability
      run: |
        set -euo pipefail
        node .github/scripts/asc-readonly.mjs verify-upload --sha "$GITHUB_SHA" --build "$IOS_BUILD_NUMBER"
    - name: Clean only this run signing files
      run: |
        set -euo pipefail
        if [ -n "${RELEASE_TEMP:-}" ]; then
          if [ -f "$RELEASE_TEMP/original-keychains.txt" ]; then
            python3 - "$RELEASE_TEMP/original-keychains.txt" <<'PY'
        import shlex, subprocess, sys
        from pathlib import Path
        subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(Path(sys.argv[1]).read_text())], check=True)
        PY
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RELEASE_TEMP/cert.p12" "$RELEASE_TEMP"/AuthKey_*.p8
        fi
      if: always()
