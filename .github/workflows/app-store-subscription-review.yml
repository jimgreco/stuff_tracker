name: App Store Subscription Review

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply metadata, availability, screenshot, and Monthly pricing
        required: true
        default: false
        type: boolean

jobs:
  subscription-review:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      SUBSCRIPTION_REVIEW_CONFIG: fastlane/subscriptions/review_metadata.json
      SUBSCRIPTION_REVIEW_SCREENSHOT: fastlane/review_assets/subscription-review.png

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Configure subscription review metadata
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLY: ${{ inputs.apply }}
        run: bundle exec ruby fastlane/scripts/configure_subscription_review.rb

      - name: Verify Monthly price in every territory
        if: ${{ inputs.apply }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          SUBSCRIPTION_PRODUCT_ID: com.jimgreco.stufftracker.pro.monthly
          TARGET_CUSTOMER_PRICE: "2.99"
          BASE_TERRITORY: USA
          DRY_RUN: "false"
        run: bundle exec ruby fastlane/scripts/update_subscription_price.rb

      - name: Audit Monthly price
        if: ${{ !inputs.apply }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          SUBSCRIPTION_PRODUCT_ID: com.jimgreco.stufftracker.pro.monthly
          TARGET_CUSTOMER_PRICE: "2.99"
          BASE_TERRITORY: USA
          DRY_RUN: "true"
        run: bundle exec ruby fastlane/scripts/update_subscription_price.rb

      - name: Verify both subscriptions are review-ready
        if: ${{ inputs.apply }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          VERIFY_ONLY: "true"
        run: bundle exec ruby fastlane/scripts/configure_subscription_review.rb
