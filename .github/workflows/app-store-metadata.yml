name: App Store Metadata

on:
  workflow_dispatch:
    inputs:
      app_store_version:
        description: Optional App Store version override; defaults to Xcode MARKETING_VERSION
        required: false
        type: string

jobs:
  metadata:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Upload metadata to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_VERSION: ${{ inputs.app_store_version }}
        run: bundle exec fastlane ios upload_metadata
