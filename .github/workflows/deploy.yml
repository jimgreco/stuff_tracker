name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this verified main commit to the shared host
        type: boolean
        default: false

concurrency:
  group: stuff-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      run_deploy: ${{ steps.changes.outputs.run_deploy }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stuff_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stuff_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stuff_tracker_test
      JWT_SECRET: ci-test-secret-that-is-long-enough-for-runtime
      GOOGLE_CLIENT_ID: ci-google-client-id
      APPLE_BUNDLE_ID: com.jimgreco.stufftracker
      NODE_ENV: test
      RUN_DATABASE_INTEGRATION_TESTS: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        working-directory: .
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed_files=$(git ls-tree -r --name-only HEAD)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git ls-tree -r --name-only HEAD)
          else
            changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|web/|\.github/release/|\.github/workflows/deploy\.yml$)'; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            echo "run_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_backend=false" >> "$GITHUB_OUTPUT"
            echo "run_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend changes
        if: steps.changes.outputs.run_backend != 'true'
        working-directory: .
        run: echo "No backend changes detected; required verify check satisfied."

      - name: Set up Node
        if: steps.changes.outputs.run_backend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.run_backend == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.run_backend == 'true'
        run: npm run build

      - name: Test
        if: steps.changes.outputs.run_backend == 'true'
        run: npm test

      - name: Audit production dependencies
        if: steps.changes.outputs.run_backend == 'true'
        run: npm audit --omit=dev

  release:
    # Unchanged gate: only a manual dispatch on main with deploy=true releases.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && needs.verify.outputs.run_deploy == 'true'
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: jimgreco/release-tools/.github/workflows/server-release.yml@ff61f1c6a6eb51ea982246473203bcc903ce8153
    with:
      tools_ref: ff61f1c6a6eb51ea982246473203bcc903ce8153
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}

  notify-failure:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.verify.result == 'failure' || needs.verify.result == 'cancelled' || needs.release.result == 'failure' || needs.release.result == 'cancelled') }}
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Notify operations
        uses: ./.github/actions/notify-operations
        with:
          webhook-url: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          title: Deploy to EC2 failed
          summary: verify=${{ needs.verify.result }}, release=${{ needs.release.result }}
